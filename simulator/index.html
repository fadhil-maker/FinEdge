<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>FinEdge Simulator Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-icon {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.1s;
        }
        .app-icon:active {
            transform: scale(0.95);
        }
    </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="w-full max-w-sm mt-12 mb-16 text-center space-y-2">
        <h1 class="text-2xl font-bold tracking-tight text-white">Simulator Hub</h1>
        <p class="text-sm text-slate-400">Select a partner bank to launch the SDK simulation.</p>
    </div>

    <div class="grid grid-cols-2 gap-x-8 gap-y-12 w-full max-w-xs">
        
        <!-- Nexus Bank -->
        <a href="nexus.html" class="flex flex-col items-center gap-3">
            <div class="app-icon w-20 h-20 rounded-2xl bg-blue-600 flex items-center justify-center border border-white/10">
                <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.315 48.315 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" />
                </svg>
            </div>
            <span class="text-xs font-medium text-slate-300">NexusBank</span>
        </a>

        <!-- FedMobile -->
        <a href="fedmobile.html" class="flex flex-col items-center gap-3">
            <div class="app-icon w-20 h-20 rounded-2xl bg-emerald-600 flex items-center justify-center border border-white/10">
                <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6" />
                </svg>
            </div>
            <span class="text-xs font-medium text-slate-300">FedMobile</span>
        </a>

        <!-- Aura Capital -->
        <a href="aura.html" class="flex flex-col items-center gap-3">
            <div class="app-icon w-20 h-20 rounded-2xl bg-purple-600 flex items-center justify-center border border-white/10">
                <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <span class="text-xs font-medium text-slate-300">Aura</span>
        </a>

    </div>

    <!-- Phone Home Indicator Mock -->
    <div class="mt-auto w-32 h-1.5 bg-slate-600 rounded-full"></div>

</body>
</html>
