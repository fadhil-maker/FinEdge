services:
  - type: web
    name: finedge-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: gunicorn finedge_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: finedge-db
          property: connectionString
      - key: NEON_PASSWORD
        sync: false
      - key: FINEDGE_HMAC_SECRET
        sync: false

databases:
  - name: finedge-db
    databaseName: neondb
    user: neondb_owner
