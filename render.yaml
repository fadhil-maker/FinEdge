services:
  - type: web
    name: finedge-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn finedge_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fin-edge-ten.vercel.app"
